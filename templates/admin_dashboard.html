<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <style>
        /* Custom Styles for Modern Look */
        body {
            background-color: #f4f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-header {
            background-color: #007bff;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 15px 15px 0 0;
        }

        .btn-primary,
        .btn-secondary {
            font-size: 1rem;
            border-radius: 50px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            background-color: #0056b3;
            color: white;
        }

        .flash-message {
            margin-bottom: 20px;
        }

        .flash-message ul {
            padding-left: 0;
            list-style: none;
        }

        .flash-message ul li {
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                Admin Dashboard
            </div>
            <div class="card-body">
                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    <div class="flash-message">
                        <ul>
                            {% for category, message in messages %}
                            <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}
                {% endwith %}

                <!-- Generate Tally Form -->
                <div class="mb-3">
                    <form action="{{ url_for('generate_tally') }}" method="POST">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Generate Tally</button>
                    </form>
                </div>

                <!-- Update Topic Section -->
                <div class="mb-3">
                    <button class="btn btn-secondary w-100" onclick="showPositionInput()">Update Topic</button>
                    <div id="position-input" class="hidden mt-3">
                        <form action="{{ url_for('update_topic') }}" method="POST">
                            <label for="new_topic" class="form-label">Enter New Topic:</label>
                            <input type="text" id="new_topic" name="new_topic" class="form-control" required>
                            <button type="submit" class="btn btn-primary mt-3 w-100">Submit Topic</button>
                        </form>
                    </div>
                </div>

                <!-- Enter Voters Section -->
                <div class="mb-3">
                    <button class="btn btn-secondary w-100" onclick="showVoterInput()">Enter Number of Voters</button>
                    <div id="voter-input" class="hidden mt-3">
                        <form action="{{ url_for('enter_voters') }}" method="POST">
                            <label for="num_voters" class="form-label">Enter Number of Voters:</label>
                            <input type="number" id="num_voters" name="num_voters" class="form-control" required min="1">
                            <button type="submit" class="btn btn-primary mt-3 w-100">Generate Voters</button>
                        </form>
                    </div>
                </div>

                <!-- View Users Button -->
                <div class="mb-3">
                    <form action="{{ url_for('view_usernames') }}" method="GET">
                        <button type="submit" class="btn btn-secondary w-100">View Users</button>
                    </form>
                </div>
                <div class="mb-3">
                <a href="{{ url_for('download_voters_pdf') }}" class="btn btn-primary w-100">Download Voters List</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Function to show the topic input field
        function showPositionInput() {
            document.getElementById('position-input').classList.toggle('hidden');
        }

        // Function to show the voters input field
        function showVoterInput() {
            document.getElementById('voter-input').classList.toggle('hidden');
        }
    </script>

</body>

</html>
