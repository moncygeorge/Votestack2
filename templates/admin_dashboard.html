<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>

    <h1>Admin Dashboard</h1>
    <div>
        <form action="{{ url_for('generate_tally') }}" method="POST">
            <button type="submit">Generate Tally</button>
        </form>

        <!-- Update Topic Button -->
        <button onclick="showPositionInput()">Update Topic</button>

        <!-- Textbox to enter topic, initially hidden -->
        <div id="position-input" class="hidden">
            <form action="{{ url_for('update_topic') }}" method="POST">
                <label for="new_topic">Enter New Topic:</label>
                <input type="text" id="new_topic" name="new_topic" required>
                <button type="submit">Submit Topic</button>
            </form>
        </div>

        <!-- Enter Voters Button -->
        <button onclick="showVoterInput()">Enter Number of Voters</button>

        <!-- Input box for entering number of voters -->
        <div id="voter-input" class="hidden">
            <form action="{{ url_for('enter_voters') }}" method="POST">
                <label for="num_voters">Enter Number of Voters:</label>
                <input type="number" id="num_voters" name="num_voters" required min="1">
                <button type="submit">Generate Voters</button>
            </form>
        </div>

        <!-- View Users Button -->
        <form action="{{ url_for('view_usernames') }}" method="GET">
            <button type="submit">View Users</button>
        </form>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

</body>
</html>
