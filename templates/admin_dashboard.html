<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script>
        // Show the input box when the "Update Topic" button is clicked
        function showTopicInput() {
            document.getElementById('topic-input').classList.remove('hidden');
        }
    </script>
</head>
<body>

    <h1>Admin Dashboard</h1>
    <div>
        <form action="{{ url_for('generate_tally') }}" method="POST">
            <button type="submit">Generate Tally</button>
        </form>

        <!-- Update Topic Button -->
        <button onclick="showTopicInput()">Update Topic</button>

        <!-- Textbox to enter topic, initially hidden -->
        <div id="topic-input" class="hidden">
            <form action="{{ url_for('update_topic') }}" method="POST">
                <label for="new_topic">Enter New Topic:</label>
                <input type="text" id="new_topic" name="new_topic" required>
                <button type="submit">Submit Topic</button>
            </form>
        </div>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

</body>
</html>
